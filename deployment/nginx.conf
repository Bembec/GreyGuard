server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  # Versioned API and version discovery keep their full path; the backend maps /api/v1/<route> to <route>.
  # This config never terminates client mTLS, so it must still unconditionally overwrite these
  # two header names to a safe, non-client-controllable value on every proxied request - the
  # backend's agent_certificate_auth.py trusts them completely once GREYGUARD_TRUST_CLIENT_CERT_HEADERS
  # is set, and without this override a client could simply send its own X-SSL-Client-Verify:
  # SUCCESS / X-SSL-Client-Cert header and impersonate any registered agent. See
  # docs/agent-certificate-authentication.md and nginx-tls.conf (the config that actually performs
  # mTLS verification) for the full header contract.
  location /api/v1/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-SSL-Client-Verify "NONE"; proxy_set_header X-SSL-Client-Cert ""; }
  location = /api/version { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-SSL-Client-Verify "NONE"; proxy_set_header X-SSL-Client-Cert ""; }
  location /api/ { proxy_pass http://backend:8000/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-SSL-Client-Verify "NONE"; proxy_set_header X-SSL-Client-Cert ""; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
