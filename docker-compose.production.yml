services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    env_file: .env.production
    environment:
      GREYGUARD_DATABASE_URL: postgresql://greyguard:${GREYGUARD_POSTGRES_PASSWORD}@postgres:5432/greyguard
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - greyguard-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [greyguard-internal]
  postgres:
    image: postgres:17-alpine
    env_file: .env.production
    environment:
      POSTGRES_DB: greyguard
      POSTGRES_USER: greyguard
      POSTGRES_PASSWORD: ${GREYGUARD_POSTGRES_PASSWORD}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - greyguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greyguard -d greyguard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [greyguard-internal]
  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    depends_on: [backend]
    ports: ["127.0.0.1:8080:8080"]
    networks: [greyguard-internal, greyguard-edge]
  sandbox-runner:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: deployment/sandbox.Dockerfile
    user: "65532:65532"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
      - seccomp=./deployment/seccomp-sandbox.json
    cap_drop: ["ALL"]
    pids_limit: 64
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /workspace:rw,noexec,nosuid,nodev,size=32m
    restart: "no"
volumes:
  greyguard-data:
  greyguard-postgres:
networks:
  greyguard-internal:
    internal: true
  greyguard-edge:
