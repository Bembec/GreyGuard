services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    env_file: .env.production
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - greyguard-data:/app/backend/data
    networks: [greyguard-internal]
  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    depends_on: [backend]
    ports: ["127.0.0.1:8080:8080"]
    networks: [greyguard-internal]
  sandbox-runner:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: deployment/sandbox.Dockerfile
    user: "65532:65532"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
      - seccomp=./deployment/seccomp-sandbox.json
    cap_drop: ["ALL"]
    pids_limit: 64
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /workspace:rw,noexec,nosuid,nodev,size=32m
    restart: "no"
volumes:
  greyguard-data:
networks:
  greyguard-internal:
    internal: true
