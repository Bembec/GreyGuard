services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    env_file: .env.production
    restart: unless-stopped
    volumes:
      - greyguard-data:/app/backend/data
    networks: [greyguard-internal]
  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:8080:8080"]
    networks: [greyguard-internal]
volumes:
  greyguard-data:
networks:
  greyguard-internal:
    internal: true
