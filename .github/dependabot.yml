version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    groups: {python-security: {applies-to: security-updates, patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups: {frontend-security: {applies-to: security-updates, patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
