version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      python-security: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      frontend-security: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
