name: Security assurance matrix
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [authentication_authorization, agent_scope_isolation, approval_replay_race, path_symlink_sandbox, redaction_rate_integrity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python scripts/run_security_assurance.py --group ${{ matrix.group }} --skip-frontend
  frontend-security:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
