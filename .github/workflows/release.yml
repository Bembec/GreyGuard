name: Controlled release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  release-images:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: deployment/backend.Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/greyguard-backend:${{ github.ref_name }}"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: deployment/frontend.Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/greyguard-frontend:${{ github.ref_name }}"}
