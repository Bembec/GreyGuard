name: GreyGuard CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
  website:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: website}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json}
      - run: npm ci
      # A preview build: unapproved claims are shown marked, and every page is noindex.
      - run: npm run build
      - run: npm run check
      - run: python3 ../scripts/check_claims.py
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose -f docker-compose.production.yml config -q
      - run: docker compose -f docker-compose.production.yml build
