[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greyguard-sdk"
version = "0.1.0"
description = "Typed Python client for the GreyGuard agent security gateway"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "GreyGuard"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["greyguard_sdk*"]
